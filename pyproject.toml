[project]
name = "enterprise-rag-document-pipeline"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
description = "Tested portfolio reference implementation by Malaksima Baghirova"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
